<title>CRM Teesha Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Charte Teesha Studio : 60 % blanc cassé · 30 % noir · 10 % vert acide (surligneur, toujours avec texte noir). Violet = touche rare.
   Layout : barre de marque + onglets, puis un écran par onglet ; la fiche contact s'ouvre en panneau latéral. */
:root {
  --bg: #fafaf7;
  --surface: #ffffff;
  --sunken: #f1f1ec;
  --ink: #0d0d0d;
  --muted: #5c5c57;
  --line: #e4e4de;
  --hl: #a3e635;
  --hl-ink: #0d0d0d;
  --violet: #4c1d95;
  --violet-ink: #fafaf7;
  --warn: #b45309;
  --danger: #b3261e;
  --ok: #3f6212;
  --shadow: 0 12px 40px rgba(13, 13, 13, .14);
  --display: "Loubag", "Anton", "Impact", "Arial Narrow", sans-serif;
  --hook: "Kollektif", "Poppins", "Avenir Next", system-ui, sans-serif;
  --body: "Neue Montreal", "Inter", "Helvetica Neue", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #161615; --sunken: #1f1f1d; --ink: #fafaf7; --muted: #b9b9b2; --line: #2e2e2b;
    --violet: #8b5cf6; --violet-ink: #0d0d0d; --warn: #f59e0b; --danger: #ff8a80; --ok: #a3e635;
    --shadow: 0 12px 40px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #161615; --sunken: #1f1f1d; --ink: #fafaf7; --muted: #b9b9b2; --line: #2e2e2b;
  --violet: #8b5cf6; --violet-ink: #0d0d0d; --warn: #f59e0b; --danger: #ff8a80; --ok: #a3e635;
  --shadow: 0 12px 40px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
mark { background: var(--hl); color: var(--hl-ink); padding: 0 .14em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 20px 14px; }
.brand { font-family: var(--display); font-size: 26px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand mark { padding: 0 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--ink); background: transparent; border-radius: 10px; padding: 9px 16px; font-family: var(--hook); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--hl); color: var(--hl-ink); }
.btn.quiet { border-color: var(--line); color: var(--muted); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 14px; font-family: var(--hook); font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--hl); }
.tab .n { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.notice { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--sunken); color: var(--muted); font-size: 14px; }
.notice[data-kind="err"] { color: var(--danger); }
main { padding-top: 24px; }
.view[hidden] { display: none; }

/* Dashboard */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 4px; }
.stat .k { font-family: var(--hook); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat.hot { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stat.hot .k { color: var(--hl); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 28px; }
.block h2 { font-family: var(--display); text-transform: uppercase; font-size: 22px; font-weight: 400; margin-bottom: 10px; }
.list { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: left; width: 100%; }
.row:hover { border-color: var(--ink); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 18px; border: 1.5px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 14px; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill[data-tone="new"] { background: var(--hl); color: var(--hl-ink); }
.pill[data-tone="new"]::before { background: var(--hl-ink); }
.pill[data-tone="warn"] { color: var(--warn); }
.pill[data-tone="danger"] { color: var(--danger); }
.pill[data-tone="ok"] { color: var(--ok); }
.pill[data-tone="violet"] { background: var(--violet); color: var(--violet-ink); }
.pill[data-tone="violet"]::before { background: var(--violet-ink); }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); margin: 2px 4px 2px 0; }

/* Pipeline */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; }
.col { background: var(--sunken); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 160px; }
.col.over { outline: 2px dashed var(--ink); }
.col h3 { font-family: var(--hook); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; display: flex; justify-content: space-between; padding: 2px 4px 6px; }
.col h3 span { color: var(--muted); font-family: var(--body); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; cursor: grab; text-align: left; width: 100%; }
.card:hover { border-color: var(--ink); }
.card .t { font-weight: 600; }
.card .s { font-size: 13px; color: var(--muted); }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.col .add { font-size: 13px; color: var(--muted); }

/* Tables */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar input, .toolbar select { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.toolbar input { flex: 1 1 220px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--hook); font-weight: 600; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--sunken); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--sunken); }
tbody tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
th.num { text-align: right; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(13, 13, 13, .45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 21; box-shadow: var(--shadow);
  display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.dhead h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 28px; line-height: 1.05; overflow-wrap: anywhere; }
.dhead .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.x { border: 0; background: var(--sunken); width: 36px; height: 36px; border-radius: 10px; font-size: 20px; line-height: 1; flex: none; }
.dbody { overflow-y: auto; padding: 18px 20px 24px; display: grid; gap: 22px; align-content: start; }
.dfoot { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface); }
.sec { display: grid; gap: 12px; }
.sec > h3 { font-family: var(--hook); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.f { display: grid; gap: 5px; min-width: 0; }
.f label, .f .lab { font-size: 13px; font-weight: 600; }
.f input, .f select, .f textarea { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; }
.f textarea { min-height: 84px; resize: vertical; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; background: var(--surface); }
.chk input { accent-color: var(--ink); }
.chk:has(input:checked) { background: var(--hl); color: var(--hl-ink); border-color: var(--hl); }
.log { display: grid; gap: 8px; }
.entry { border-left: 3px solid var(--ink); padding: 4px 0 4px 12px; display: grid; gap: 2px; }
.entry .when { font-size: 12px; color: var(--muted); }
.entry .next { font-size: 13px; }
.entry .next b { background: var(--hl); color: var(--hl-ink); padding: 0 4px; font-weight: 600; }
.newlog { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--sunken); }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--danger); }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 11px 18px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
.toast b { color: var(--hl); }

@media (max-width: 560px) {
  .brand { font-size: 22px; }
  .stat .v { font-size: 32px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .2s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Teesha <mark>Studio</mark> CRM</div>
    <div class="actions">
      <label class="btn quiet" for="csv" id="importLbl">Importer les réponses Tally (CSV)</label>
      <input type="file" id="csv" accept=".csv,text/csv" hidden>
      <button class="btn primary" id="newContact" type="button">+ Nouveau contact</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="dash" aria-selected="true">Tableau de bord</button>
    <button class="tab" role="tab" data-tab="pipe" aria-selected="false">Pipeline <span class="n" id="nPipe"></span></button>
    <button class="tab" role="tab" data-tab="contacts" aria-selected="false">Contacts <span class="n" id="nContacts"></span></button>
    <button class="tab" role="tab" data-tab="projets" aria-selected="false">Projets <span class="n" id="nProjets"></span></button>
  </nav>
  <div class="notice" id="notice" hidden></div>

  <main>
    <section class="view" id="v-dash">
      <div class="stats" id="stats"></div>
      <div class="cols2">
        <div class="block"><h2>À traiter</h2><div class="list" id="todo"></div></div>
        <div class="block"><h2>Livraisons à venir</h2><div class="list" id="deliveries"></div></div>
      </div>
    </section>

    <section class="view" id="v-pipe" hidden>
      <div class="board" id="board"></div>
    </section>

    <section class="view" id="v-contacts" hidden>
      <div class="toolbar">
        <input type="search" id="q" placeholder="Rechercher un nom, une niche, un @instagram…" aria-label="Rechercher">
        <select id="fStage" aria-label="Filtrer par étape"><option value="">Toutes les étapes</option></select>
        <select id="fNeed" aria-label="Filtrer par besoin"><option value="">Tous les besoins</option></select>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Nom</th><th>Étape</th><th>Besoin</th><th>Budget</th><th>Contact</th><th>Relance</th><th class="num">Encaissé</th><th>Reçue le</th></tr></thead>
        <tbody id="tContacts"></tbody>
      </table></div>
    </section>

    <section class="view" id="v-projets" hidden>
      <div class="toolbar">
        <select id="fProj" aria-label="Filtrer les projets">
          <option value="actifs">Projets actifs</option>
          <option value="impayes">Reste à encaisser</option>
          <option value="">Tous les projets</option>
        </select>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Projet</th><th>Cliente</th><th>Statut</th><th>Offre</th><th>Livraison</th><th class="num">Total</th><th class="num">Payé</th><th class="num">Reste</th></tr></thead>
        <tbody id="tProjets"></tbody>
      </table></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dTitle"></aside>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  // ---------- Référentiels (libellés identiques au formulaire) ----------
  const STAGES = [
    { id: "Nouvelle demande", tone: "new" },
    { id: "À contacter", tone: "warn" },
    { id: "Appel découverte", tone: "" },
    { id: "Proposition envoyée", tone: "violet" },
    { id: "Cliente en cours", tone: "ok" },
    { id: "Cliente terminée", tone: "ok" },
    { id: "Pas de suite", tone: "danger" }
  ];
  const CLOSED = ["Cliente terminée", "Pas de suite"];
  const NEEDS = ["Branding / identité visuelle", "Création de contenu Instagram", "Community management", "Templates personnalisés",
    "Coaching 1:1", "Session unique", "Accompagnement complet", "Je ne sais pas encore (je veux être guidée)"];
  const SINCE = ["Je commence", "Moins de 6 mois", "6 mois à 1 an", "1 à 2 ans", "Plus de 2 ans"];
  const GOALS = ["Clarifier mon image", "Améliorer mon Instagram", "Avoir un branding pro", "Gagner du temps sur le contenu", "Déléguer complètement",
    "Lancer mon business correctement", "Booster ma motivation / mon mindset", "Augmenter ma visibilité", "Structurer mon projet", "Autre"];
  const BUDGETS = ["Moins de 50 € (petits produits digitaux)", "50 à 150 €", "150 à 300 €", "300 à 600 €", "600 € et plus (prestations premium / coaching)"];
  const PREFS = ["Instagram", "E-mail", "WhatsApp", "Peu importe"];
  const SOURCES = ["Instagram", "Recommandation", "TikTok", "Recherche Google", "Autre"];
  const PRIOS = ["Chaude", "Tiède", "Froide"];
  const CHANNELS = ["DM Instagram", "E-mail", "WhatsApp", "Appel", "Visio"];
  const PSTATUS = [
    { id: "À démarrer", tone: "" }, { id: "En cours", tone: "new" }, { id: "En attente cliente", tone: "warn" },
    { id: "Livré", tone: "ok" }, { id: "Annulé", tone: "danger" }
  ];
  const OFFERS = ["Branding / identité visuelle", "Création de contenu Instagram", "Community management", "Templates personnalisés",
    "Coaching 1:1", "Session unique", "Accompagnement complet", "Produit digital"];
  const PAY = ["PayPal", "Stripe", "Revolut", "Virement", "Espèces"];

  // ---------- État ----------
  let db = null, canWrite = false;
  let contacts = [], projets = [];
  let tab = "dash";
  let open = null; // { kind: "contact"|"projet", id, draft }

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Date().toISOString().slice(0, 10);
  const eur = n => (Number(n) || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  const fdate = d => { if (!d) return "—"; const x = new Date(d.length === 10 ? d + "T12:00:00" : d); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: x.getFullYear() === new Date().getFullYear() ? undefined : "numeric" }); };
  const tone = (list, id) => (list.find(s => s.id === id) || {}).tone || "";
  const pill = (list, id) => id ? `<span class="pill" data-tone="${tone(list, id)}">${esc(id)}</span>` : "";
  const paid = cid => projets.filter(p => p.contactId === cid && p.statut !== "Annulé").reduce((a, p) => a + (Number(p.paye) || 0), 0);
  const nameOf = cid => (contacts.find(c => c.id === cid) || {}).nom || "—";
  const isDue = c => c.relance && c.relance <= today() && !CLOSED.includes(c.etape);
  const reste = p => Math.max(0, (Number(p.total) || 0) - (Number(p.paye) || 0));

  function toast(html) {
    const t = $("#toast"); t.innerHTML = html; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600);
  }
  function notice(text, kind) { const n = $("#notice"); n.textContent = text || ""; n.hidden = !text; n.dataset.kind = kind || ""; }

  // ---------- Rendu ----------
  function render() {
    $("#nPipe").textContent = contacts.filter(c => !CLOSED.includes(c.etape)).length || "";
    $("#nContacts").textContent = contacts.length || "";
    $("#nProjets").textContent = projets.length || "";
    renderDash(); renderBoard(); renderContacts(); renderProjets();
  }

  function renderDash() {
    const nouv = contacts.filter(c => c.etape === "Nouvelle demande" || c.etape === "À contacter").length;
    const due = contacts.filter(isDue).length;
    const enCours = projets.filter(p => p.statut === "En cours" || p.statut === "En attente cliente" || p.statut === "À démarrer").length;
    const month = today().slice(0, 7);
    const caMois = projets.filter(p => p.statut !== "Annulé" && (p.payeLe || "").slice(0, 7) === month).reduce((a, p) => a + (Number(p.paye) || 0), 0);
    const aEnc = projets.filter(p => p.statut !== "Annulé").reduce((a, p) => a + reste(p), 0);
    const won = contacts.filter(c => c.etape === "Cliente en cours" || c.etape === "Cliente terminée").length;
    const conv = contacts.length ? Math.round(won / contacts.length * 100) + " %" : "—";
    $("#stats").innerHTML = [
      ["Nouvelles demandes", nouv, nouv > 0], ["À relancer", due, false], ["Projets actifs", enCours, false],
      ["Encaissé ce mois", eur(caMois), false], ["Reste à encaisser", eur(aEnc), false], ["Taux de signature", conv, false]
    ].map(([k, v, hot]) => `<div class="stat${hot ? " hot" : ""}"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");

    const todo = contacts
      .filter(c => c.etape === "Nouvelle demande" || c.etape === "À contacter" || isDue(c))
      .sort((a, b) => (a.relance || a.recuLe || "").localeCompare(b.relance || b.recuLe || ""));
    $("#todo").innerHTML = todo.length ? todo.slice(0, 12).map(c => `
      <button class="row" data-open-contact="${esc(c.id)}">
        <div class="main"><div class="t">${esc(c.nom || "Sans nom")}</div>
        <div class="s">${isDue(c) ? "Relance prévue " + fdate(c.relance) : "Reçue " + fdate(c.recuLe)} · ${esc((c.besoin || []).join(", ") || c.activite || "")}</div></div>
        ${pill(STAGES, c.etape)}</button>`).join("")
      : `<div class="empty">Rien à traiter. Les nouvelles demandes et les relances du jour apparaîtront ici.</div>`;

    const liv = projets.filter(p => p.livraison && !["Livré", "Annulé"].includes(p.statut)).sort((a, b) => a.livraison.localeCompare(b.livraison));
    $("#deliveries").innerHTML = liv.length ? liv.slice(0, 10).map(p => `
      <button class="row" data-open-projet="${esc(p.id)}">
        <div class="main"><div class="t">${esc(p.titre || "Projet")}</div><div class="s">${esc(nameOf(p.contactId))} · ${fdate(p.livraison)}</div></div>
        ${pill(PSTATUS, p.statut)}</button>`).join("")
      : `<div class="empty">Aucune livraison prévue. Crée un projet depuis la fiche d'une cliente pour suivre ses dates.</div>`;
  }

  function renderBoard() {
    $("#board").innerHTML = STAGES.map(s => {
      const items = contacts.filter(c => (c.etape || "Nouvelle demande") === s.id).sort((a, b) => (b.recuLe || "").localeCompare(a.recuLe || ""));

  // ---------- Import CSV Tally ----------
  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    text = text.replace(/^﻿/, "");
    const sep = (text.split("\n")[0].match(/;/g) || []).length > (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim()));
  }
  const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  function pick(list, raw) {
    const n = norm(raw).replace(/[^a-z0-9]+/g, " ").trim(); if (!n) return "";
    const exact = list.find(o => norm(o).replace(/[^a-z0-9]+/g, " ").trim() === n); if (exact) return exact;
    const fixes = { "je commmence": "Je commence", "moins de 6ans": "Moins de 6 mois", "6 mois 1 an": "6 mois à 1 an", "2 ans": "Plus de 2 ans", "email": "E-mail", "recherche": "Recherche Google" };
    for (const k in fixes) if (n === k || n.endsWith(k) && list.includes(fixes[k])) return fixes[k];
    if (list === BUDGETS) {
      const has = x => new RegExp("\\b" + x + "\\b").test(n);
      if (has("150") && has("300")) return BUDGETS[2];
      if (has("300") && has("600")) return BUDGETS[3];
      if (has("50") && has("150")) return BUDGETS[1];
      if (has("600")) return BUDGETS[4];
      if (has("50")) return BUDGETS[0];
    }
    const starts = list.find(o => norm(o).startsWith(n) || n.startsWith(norm(o).slice(0, 12))); return starts || "";
  }

  async function importCSV(file) {
    const rows = parseCSV(await file.text());
    if (rows.length < 2) { notice("Ce fichier ne contient aucune réponse.", "err"); return; }
    const head = rows[0].map(norm);
    const col = test => head.findIndex(test);
    const idx = {
      id: col(h => h.includes("submission id") || h === "id"),
      date: col(h => h.includes("submitted at") || h.includes("date de soumission") || h === "date"),
      nom: col(h => h.includes("nom")), email: col(h => h.includes("mail")),
      instagram: col(h => h.includes("instagram") && !h.includes("contact") && !h.includes("decouv")),
      activite: col(h => h.includes("activite") || h.includes("niche")),
      since: col(h => h.includes("combien de temps") || h.includes("lancee")),
      projet: col(h => h.includes("explique") || (h.includes("projet") && !h.includes("objectif") && !h.includes("budget"))),
      blocages: col(h => h.includes("blocage")), budget: col(h => h.includes("budget")), deadline: col(h => h.includes("deadline")),
      fichiers: col(h => h.includes("fichier")), pref: col(h => h.includes("contacte")), source: col(h => h.includes("decouv"))
    };
    const needCols = head.map((h, i) => h.includes("besoin") && !h.includes("explique") ? i : -1).filter(i => i >= 0);
    const goalCols = head.map((h, i) => h.includes("objectif") ? i : -1).filter(i => i >= 0);
    const srcCols = head.map((h, i) => h.includes("decouv") ? i : -1).filter(i => i >= 0);
    if (idx.nom < 0 && idx.email < 0) { notice("Je ne reconnais pas ce fichier : il faut l'export CSV des réponses du formulaire « Premier contact ».", "err"); return; }

    const truthy = v => /^(true|vrai|1|x|oui|yes)$/i.test(String(v).trim());
    const optFromHead = h => { const m = rows[0][h].match(/\(([^()]*(\([^()]*\))?[^()]*)\)\s*$/); return m ? m[1] : ""; };
    const multi = (r, cols, list) => {
      const out = [];
      cols.forEach(i => {
        const v = (r[i] || "").trim(); if (!v) return;
        if (truthy(v)) { const o = pick(list, optFromHead(i)); o && out.push(o); return; }
        v.split(/\s*,\s*(?![^()]*\))/).forEach(part => { const o = pick(list, part); if (o) out.push(o); else if (part && list === GOALS) out.push("Autre:" + part); });
      });
      return [...new Set(out)];
    };

    let added = 0, skipped = 0;
    for (const r of rows.slice(1)) {
      const g = i => (i >= 0 ? (r[i] || "").trim() : "");
      const sid = g(idx.id), email = g(idx.email).toLowerCase(), nom = g(idx.nom);
      if (!nom && !email) continue;
      const docId = ("tally-" + (sid || (email + "-" + g(idx.date)))).replace(/[^A-Za-z0-9_\-.~:@+]/g, "-").slice(0, 180);
      if (contacts.some(c => c.id === docId)) { skipped++; continue; }
      const goals = multi(r, goalCols, GOALS);
      const other = goals.find(x => x.startsWith("Autre:"));
      const srcs = multi(r, srcCols, SOURCES);
      const d = g(idx.date); const iso = d && !isNaN(new Date(d.replace(" ", "T"))) ? new Date(d.replace(" ", "T")).toISOString() : new Date().toISOString();
      const doc = {
        nom, email, instagram: g(idx.instagram), activite: g(idx.activite), anciennete: pick(SINCE, g(idx.since)),
        besoin: multi(r, needCols, NEEDS), projet: g(idx.projet),
        objectif: other ? "Autre" : (goals[0] || ""), objectifAutre: other ? other.slice(6) : "",
        blocages: g(idx.blocages), budget: pick(BUDGETS, g(idx.budget)), deadline: g(idx.deadline), fichiers: g(idx.fichiers),
        contactPref: pick(PREFS, g(idx.pref)), source: srcs.find(s => !s.startsWith("Autre:")) || (srcs.length ? "Autre" : ""),
        etape: "Nouvelle demande", recuLe: iso, echanges: [], origine: "Tally"
      };
      const ok = await write(() => db.collection("contacts").doc(docId).set(doc));
      if (!ok) break;
      added++;
    }
    toast(added ? `<b>${added}</b> demande${added > 1 ? "s" : ""} importée${added > 1 ? "s" : ""}${skipped ? ` · ${skipped} déjà présente${skipped > 1 ? "s" : ""}` : ""}` : `Rien de nouveau : ${skipped} demande${skipped > 1 ? "s" : ""} déjà dans le CRM`);
    setTab("pipe");
  }

  // ---------- Navigation & événements ----------
  function setTab(t) {
    tab = t;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    document.querySelectorAll(".view").forEach(v => (v.hidden = v.id !== "v-" + t));
    try { localStorage.setItem("crm-tab", t); } catch (e) {}
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab],[data-open-contact],[data-open-projet],[data-close],[data-save],[data-add-log],[data-new-projet],[data-ask-del],[data-do-del],[data-cancel-del]");
    if (!t) { if (e.target === $("#scrim")) closeDrawer(); return; }
    if (t.dataset.tab) setTab(t.dataset.tab);
    else if (t.dataset.openContact !== undefined) openContact(t.dataset.openContact);
    else if (t.dataset.openProjet) openProjet(t.dataset.openProjet);
    else if (t.hasAttribute("data-close")) closeDrawer();
    else if (t.hasAttribute("data-save")) save();
    else if (t.hasAttribute("data-add-log")) addLog();
    else if (t.dataset.newProjet !== undefined) openProjet(null, t.dataset.newProjet);
    else if (t.hasAttribute("data-ask-del")) askDelete();
    else if (t.hasAttribute("data-do-del")) doDelete();
    else if (t.hasAttribute("data-cancel-del")) $("#delZone").innerHTML = `<button class="btn quiet" type="button" data-ask-del>Supprimer</button>`;
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer();
    if (e.key === "Enter" && e.target.matches("tr[data-open-contact]")) openContact(e.target.dataset.openContact);
    if (e.key === "Enter" && e.target.matches("tr[data-open-projet]")) openProjet(e.target.dataset.openProjet);
  });
  $("#newContact").addEventListener("click", () => openContact(null));
  $("#csv").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importCSV(f); });
  ["#q", "#fStage", "#fNeed"].forEach(s => $(s).addEventListener("input", renderContacts));
  $("#fProj").addEventListener("input", renderProjets);
  $("#fStage").innerHTML += STAGES.map(s => `<option>${esc(s.id)}</option>`).join("");
  $("#fNeed").innerHTML += NEEDS.map(n => `<option>${esc(n)}</option>`).join("");

  // Glisser-déposer dans le pipeline
  let dragId = null;
  document.addEventListener("dragstart", e => { const c = e.target.closest(".card"); if (c) { dragId = c.dataset.id; e.dataTransfer.effectAllowed = "move"; } });
  document.addEventListener("dragover", e => { const col = e.target.closest(".col"); if (col && dragId) { e.preventDefault(); col.classList.add("over"); } });
  document.addEventListener("dragleave", e => { const col = e.target.closest(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });
  document.addEventListener("drop", e => { const col = e.target.closest(".col"); if (col && dragId) { e.preventDefault(); col.classList.remove("over"); moveStage(dragId, col.dataset.stage); dragId = null; } });
  document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".col.over").forEach(c => c.classList.remove("over")); });

  try { const t = localStorage.getItem("crm-tab"); if (t) setTab(t); } catch (e) {}
  render();

  // ---------- Données ----------
  (async () => {
    const [store, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
    if (!store) {
      notice("Les données ne sont pas disponibles ici. Ouvre le CRM depuis ton compte Claude pour voir et modifier tes contacts.");
      $("#newContact").disabled = true; $("#importLbl").hidden = true; return;
    }
    db = store;
    canWrite = user ? (user.canEdit ? await user.canEdit() : true) !== false : true;
    if (!canWrite) { notice("Lecture seule : seule la propriétaire du CRM peut modifier les fiches."); $("#newContact").disabled = true; $("#importLbl").hidden = true; }
    const fail = () => notice("La synchronisation s'est interrompue. Recharge la page pour retrouver tes données à jour.", "err");
    db.collection("contacts").onSnapshot(s => { contacts = s.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, fail);
    db.collection("projets").onSnapshot(s => { projets = s.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, fail);
  })();
})();
</script>
